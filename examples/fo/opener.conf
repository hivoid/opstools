# =====================================================================
# fo 打开器映射表
# 路径: ~/.config/fo/opener.conf  （可用 FO_OPENER_CONF 覆盖）
#
# 语法:
#   扩展名 = 命令 [参数...]
#
#   * 扩展名不区分大小写（.PDF 与 .pdf 等价）
#   * 值按空白拆分为 argv，不支持含空格的单个参数
#   * 不支持行尾注释，不支持引号
#
# 运行方式前缀（可选，写在命令最前面）:
#   无前缀   → auto 自动判定（见脚本内 TUI 名单 + 显示服务器探测）
#   !        → 强制前台（阻塞终端，TUI 程序必需）
#   &        → 强制脱钩（不占终端，GUI 程序）
#
# 命令必须存在于 PATH，否则 fo 启动时报错退出
# 扩展名重复时以文件中最后一条为准
# =====================================================================


# ---------------------------------------------------------------------
# 【纯文本 / 代码】全部用 TUI 编辑器 → 前台，退出后回到 shell
# ---------------------------------------------------------------------
