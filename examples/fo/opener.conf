# ---------------------------------------------------------------------
# 【目录类】（fo 也可能选到目录时; fzf 候选默认仅文件, 此组多为占位）
# ---------------------------------------------------------------------
# 无

# =====================================================================
# 常见问题备注
# =====================================================================
# 1. .ts 冲突: MPEG-TS 视频与 TypeScript 都用 .ts, 上面按视频配置了。
#    若你的场景 TS 代码更多, 改成:   ts = !nvim
#
# 2. 编辑器统一改法: 全文把 !nvim 换成 !vim / !hx / !emacs 即可;
#    TUI 编辑器必须带 ! 前缀, 否则 auto 判定依赖内置名单——名单内
#    程序即使省略 ! 也会走前台, 但显式写 ! 更稳妥、可读。
#
# 3. okular/zathura 等 GUI 查看器即使不带 &, auto 默认也是脱钩;
#    显式写 & 是自文档化, 推荐。
#
# 4. csv 双歧义: !vd (visidata, TUI 前台) 适合数据探查;
#    想表格图形界面用 &libreoffice, 想纯文本用 !nvim。
#
# 5. 视频的 --force-window 只给音频加了, 因为纯音频下 mpv 无窗口
#    时只出终端状态条, 脱钩后看不到任何东西。
#
# 6. 未匹配的扩展名 → 走 xdg-open (Linux) / open (macOS) 默认通道,
#    auto 模式下统一脱钩, 与桌面行为一致。
#
# 7. 想给某类型单独走前台看输出(如查看 SVG 源码):
#    svgsrc = !nvim  (自造扩展名也行, fo 按字面匹配)
# =====================================================================
